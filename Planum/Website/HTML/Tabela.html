<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../../Imagens/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../Imagens/favicon-16x16.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planum - Estoque</title>

    <link rel="stylesheet" href="../CSS/Web.css">
</head>

<body>

    <div class="Estoque">

        <div class="Cabeçalho_Estoque">

            <div class="titulo">
                <h1>Estoque</h1>
            </div>

            <div class="Ações">
                <button id="Novoproduto">+ Novo Produto</button>
            </div>

        </div>

        <div class="Ferramentas">

            <div class="busca">
                <input
                    type="text"
                    placeholder="Buscar produto..."
                >
            </div>

            <div class="Filtros">
                <button>Filtros</button>
            </div>

        </div>


        <div class="Grid">

            <div class="Cabeçalho_Planilha">

                <div>ID</div>
                <div>Produto</div>
                <div>Quantidade</div>
                <div>Unidade</div>
                <div>Preço</div>
                <div>Status</div>

            </div>

        </div>

    </div>

</body>
<script src="../JS/Web.js"></script>
</html>
